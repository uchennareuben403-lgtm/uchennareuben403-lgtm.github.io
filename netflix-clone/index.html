<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h1 class="logo">NETFLIX</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">My List</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h2>Unlimited Movies,<br>TV Shows & More.</h2>

        <p>Watch anywhere. Cancel anytime.</p>

        <button>▶ Play</button>
        <button class="info-btn">More Info</button>
    </div>
</section>

<section class="movies">
    <h2>Popular Movies</h2>

    <div class="movie-row">

        <div class="movie-card">Movie 1</div>
        <div class="movie-card">Movie 2</div>
        <div class="movie-card">Movie 3</div>
        <div class="movie-card">Movie 4</div>
        <div class="movie-card">Movie 5</div>
        <div class="movie-card">Movie 6</div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
